name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the manifest
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version plugin/.claude-plugin/plugin.json)"
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' docs/CHANGELOG.md > notes.md
      - name: Plugin zip
        run: |
          git archive --format=zip -o prismantis-plugin.zip "$GITHUB_SHA:plugin"
          echo "prismantis-plugin.zip sha256: $(sha256sum prismantis-plugin.zip | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md prismantis-plugin.zip
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Move the release branch the Claude directory follows
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$GITHUB_SHA" -F force=false
        env:
          GH_TOKEN: ${{ github.token }}

  install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        claude: ['2.1.287', latest]
    name: install from the zip (claude ${{ matrix.claude }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - name: Install the release zip through a marketplace pinned to its sha256
        env:
          URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/prismantis-plugin.zip?ci=${{ github.run_id }}-${{ matrix.claude }}
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cfg"
          mkdir -p "$CLAUDE_CONFIG_DIR" "$RUNNER_TEMP/m/.claude-plugin"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/plugin.zip" "$URL"
          sha=$(sha256sum "$RUNNER_TEMP/plugin.zip" | cut -d' ' -f1)
          jq -n --arg url "$URL" --arg sha "$sha" '{name: "release", owner: {name: "ci"}, plugins: [{name: "prismantis", source: {source: "archive", url: $url, sha256: $sha}}]}' > "$RUNNER_TEMP/m/.claude-plugin/marketplace.json"
          claude plugin marketplace add "$RUNNER_TEMP/m"
          claude plugin install prismantis@release
          claude -p /prismantis | grep -F '## Commands'
